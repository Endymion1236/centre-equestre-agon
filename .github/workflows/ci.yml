name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test]

jobs:
  validate:
    name: Validation & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` et non `npm install` : il installe EXACTEMENT le contenu du
      # fichier de verrouillage et échoue s'il est désynchronisé, au lieu de le
      # réécrire en silence. Sans ça, chaque build (local, CI, Vercel) pouvait
      # résoudre des versions différentes — on perdait la seule propriété qui
      # rend un lockfile utile : ce qui est testé est ce qui est déployé.
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      # `validate:all` a été RETIRÉ de la CI, et pas seulement parce qu'il
      # échouait faute d'identifiants : ce script ouvre une connexion Firebase
      # Admin sur la VRAIE base et y crée puis supprime des documents. Le faire
      # tourner à chaque proposition de modification ferait écrire dans la base
      # de production par n'importe quelle branche — une CI qui touche aux
      # données du centre est pire que pas de CI. Il reste lancé à la main,
      # localement, contre la base de test (`npm run validate:all`).
      #
      # À la place, les deux vérifications qui n'ont besoin d'aucun identifiant :
      # elles lisent le code source et les règles Firestore, rien d'autre.
      - name: Audit de cohérence
        run: npm run audit

      - name: Règles Firestore
        run: npm run validate:rules

      - name: Build check
        run: npx next build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          CAWL_SECRET_API_KEY: ${{ secrets.CAWL_SECRET_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
